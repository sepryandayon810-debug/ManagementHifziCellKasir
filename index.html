<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WebPOS - Dashboard</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --success: #059669;
      --warning: #d97706;
      --danger: #dc2626;
      --bg-base: #f8fafc;
      --bg-surface: #ffffff;
      --bg-subtle: #f1f5f9;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-sub: #475569;
      --radius-md: 12px;
      --radius-lg: 16px;
      --sidebar-width: 270px;
      --header-h: 68px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
    }
    .app-container { display: flex; min-height: 100vh; }

    /* SIDEBAR */
    .sidebar {
      width: var(--sidebar-width); height: 100vh;
      background: var(--bg-surface); border-right: 1px solid var(--border);
      position: fixed; top: 0; left: 0; display: flex; flex-direction: column;
      z-index: 1000;
    }
    .sidebar-header {
      height: var(--header-h); padding: 0 1.25rem;
      display: flex; align-items: center; gap: 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .logo-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: bold; font-size: 1.15rem;
    }
    .logo-text { font-size: 1.25rem; font-weight: 800; color: var(--primary); }
    .sidebar-nav { flex: 1; overflow-y: auto; padding: 1.25rem 0.75rem; }
    .nav-section-title {
      font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-muted); padding: 0.35rem 0.75rem;
    }
    .nav-menu { list-style: none; margin-bottom: 1rem; }
    .nav-link {
      display: flex; align-items: center; gap: 0.85rem;
      padding: 0.65rem 0.85rem; border-radius: var(--radius-md);
      color: var(--text-sub); text-decoration: none; font-size: 0.88rem; font-weight: 600;
    }
    .nav-link:hover { background: var(--bg-subtle); color: var(--primary); }
    .nav-link.active { background: var(--primary-light); color: var(--primary); }
    .nav-link i { width: 20px; text-align: center; }

    /* MAIN */
    .main-content {
      flex: 1; margin-left: var(--sidebar-width);
      display: flex; flex-direction: column; min-width: 0;
    }
    .main-header {
      height: var(--header-h); background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.5rem; position: sticky; top: 0; z-index: 50;
    }
    .page-content { padding: 1.5rem; flex: 1; }

    /* METRIC CARDS */
    .metric-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem; margin-bottom: 1.5rem;
    }
    .metric-card {
      background: var(--bg-surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 1.25rem;
      display: flex; align-items: center; gap: 1rem;
    }
    .metric-icon {
      width: 48px; height: 48px; border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center; font-size: 1.25rem;
    }
    .metric-val { font-size: 1.4rem; font-weight: 800; line-height: 1.2; }
    .metric-lbl { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }

    /* QUICK SHORTCUTS */
    .quick-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
    }
    .quick-btn {
      background: var(--bg-surface); border: 1.5px solid var(--border);
      border-radius: var(--radius-lg); padding: 1.25rem;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.5rem; text-decoration: none; color: var(--text-main); font-weight: 700; font-size: 0.85rem;
      transition: all 0.2s;
    }
    .quick-btn:hover { border-color: var(--primary); transform: translateY(-3px); }
    .quick-btn i { font-size: 1.75rem; color: var(--primary); }

    .btn-logout {
      padding: 0.45rem 0.85rem; border-radius: 8px; border: 1px solid var(--border);
      background: transparent; color: var(--danger); font-weight: 600; cursor: pointer;
    }

    @media (max-width: 1024px) {
      .sidebar { display: none; }
      .main-content { margin-left: 0; }
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
</head>
<body>

<div class="app-container">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon"><i class="fas fa-cash-register"></i></div>
      <span class="logo-text">WebPOS</span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-title">Menu Utama</div>
      <ul class="nav-menu">
        <li><a href="index.html" class="nav-link active"><i class="fas fa-chart-pie"></i><span>Dashboard</span></a></li>
        <li><a href="page-kasir.html" class="nav-link"><i class="fas fa-calculator"></i><span>Kasir POS</span></a></li>
        <li><a href="page-produk.html" class="nav-link"><i class="fas fa-boxes-stacked"></i><span>Produk & Stok</span></a></li>
      </ul>
      <div class="nav-section-title">Transaksi</div>
      <ul class="nav-menu">
        <li><a href="page-riwayat.html" class="nav-link"><i class="fas fa-receipt"></i><span>Riwayat</span></a></li>
        <li><a href="page-hutang.html" class="nav-link"><i class="fas fa-hand-holding-dollar"></i><span>Buku Hutang</span></a></li>
      </ul>
    </nav>
  </aside>

  <main class="main-content">
    <header class="main-header">
      <h1 style="font-size:1.2rem; font-weight:700;">Ringkasan Operasional</h1>
      <button class="btn-logout" id="btnLogout"><i class="fas fa-arrow-right-from-bracket"></i> Keluar</button>
    </header>

    <div class="page-content">
      <div class="metric-grid">
        <div class="metric-card">
          <div class="metric-icon" style="background:rgba(5,150,105,0.1); color:var(--success);"><i class="fas fa-wallet"></i></div>
          <div>
            <div class="metric-val" id="dashKasLaci">Rp 0</div>
            <div class="metric-lbl">Kas Fisik Laci</div>
          </div>
        </div>
        <div class="metric-card">
          <div class="metric-icon" style="background:var(--primary-light); color:var(--primary);"><i class="fas fa-cart-shopping"></i></div>
          <div>
            <div class="metric-val" id="dashPenjualan">Rp 0</div>
            <div class="metric-lbl">Penjualan Hari Ini</div>
          </div>
        </div>
        <div class="metric-card">
          <div class="metric-icon" style="background:rgba(217,119,6,0.1); color:var(--warning);"><i class="fas fa-receipt"></i></div>
          <div>
            <div class="metric-val" id="dashTrxCount">0</div>
            <div class="metric-lbl">Transaksi Selesai</div>
          </div>
        </div>
      </div>

      <h2 style="font-size:1rem; font-weight:700; margin-bottom:0.75rem;">Aksi Cepat</h2>
      <div class="quick-grid">
        <a href="page-kasir.html" class="quick-btn">
          <i class="fas fa-calculator"></i>
          <span>Buka Mesin Kasir</span>
        </a>
        <a href="page-produk.html" class="quick-btn">
          <i class="fas fa-boxes-stacked"></i>
          <span>Kelola Stok & Reseller</span>
        </a>
        <a href="page-hutang.html" class="quick-btn">
          <i class="fas fa-hand-holding-dollar"></i>
          <span>Catatan Piutang</span>
        </a>
      </div>
    </div>
  </main>
</div>

<script>
  auth.onAuthStateChanged(async (user) => {
    if (!user) {
      window.location.href = "login.html";
      return;
    }

    const todayStr = Utils.getTodayString();
    try {
      const snap = await database.ref("transactions/" + todayStr).once("value");
      const data = snap.val() || {};
      let totalJual = 0, count = 0;

      Object.values(data).forEach(t => {
        if (t.status !== "cancelled") {
          totalJual += t.total || 0;
          count++;
        }
      });

      document.getElementById("dashPenjualan").textContent = Utils.formatRupiah(totalJual);
      document.getElementById("dashTrxCount").textContent = count.toString();
      document.getElementById("dashKasLaci").textContent = Utils.formatRupiah(totalJual);
    } catch(e) {
      console.error(e);
    }
  });

  document.getElementById("btnLogout").onclick = () => {
    if (confirm("Keluar dari sistem?")) {
      auth.signOut().then(() => window.location.href = "login.html");
    }
  };
</script>

</body>
</html>
