<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - WebPOS Hifzi Cell</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      padding: 2rem;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
    }
    .brand-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo-badge {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.25rem;
      margin-bottom: 0.75rem;
    }
    .brand-title { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; }
    .brand-desc { font-size: 0.82rem; color: var(--text-muted); margin-top: 0.25rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 0.4rem; }
    .input-wrap { position: relative; }
    .input-wrap i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .form-control {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.5rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.88rem;
      outline: none;
      font-family: inherit;
      background: #fff;
    }
    .form-control:focus { border-color: var(--primary); }
    .btn-submit {
      width: 100%;
      padding: 0.8rem;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background 0.15s;
    }
    .btn-submit:hover { background: var(--primary-hover); }
    .alert-error {
      padding: 0.75rem;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      border-radius: 8px;
      font-size: 0.8rem;
      margin-bottom: 1rem;
      display: none;
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
</head>
<body>

<div class="login-card">
  <div class="brand-header">
    <div class="logo-badge"><i class="fas fa-cash-register"></i></div>
    <h1 class="brand-title">WebPOS Hifzi Cell</h1>
    <p class="brand-desc">Masuk untuk mengakses sistem kasir & manajemen</p>
  </div>

  <div class="alert-error" id="loginError"></div>

  <form id="formLogin">
    <div class="form-group">
      <label class="form-label">Email</label>
      <div class="input-wrap">
        <i class="fas fa-envelope"></i>
        <input type="email" class="form-control" id="loginEmail" placeholder="nama@toko.com" required>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock"></i>
        <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
      </div>
    </div>
    <button type="submit" class="btn-submit" id="btnLogin">
      <span>Masuk ke Sistem</span>
      <i class="fas fa-arrow-right"></i>
    </button>
  </form>
</div>

<script>
  document.getElementById("formLogin").onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value.trim();
    const pass = document.getElementById("loginPassword").value;
    const errBox = document.getElementById("loginError");
    const btn = document.getElementById("btnLogin");

    errBox.style.display = "none";
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memverifikasi...';

    try {
      await auth.signInWithEmailAndPassword(email, pass);
      window.location.href = "index.html";
    } catch (err) {
      errBox.textContent = "Email atau password tidak sesuai. Silakan periksa kembali.";
      errBox.style.display = "block";
      btn.disabled = false;
      btn.innerHTML = '<span>Masuk ke Sistem</span> <i class="fas fa-arrow-right"></i>';
    }
  };
</script>

</body>
</html>
