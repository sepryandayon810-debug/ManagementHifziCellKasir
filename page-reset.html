<!doctype html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebPOS - Reset Data</title><style>body{font-family:Arial,sans-serif;background:#fff7f7;color:#0f172a;margin:0}.wrap{max-width:700px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#fff;border:1px solid #fecaca;border-radius:16px;padding:24px;margin-top:20px}.danger{color:#b91c1c}.form{display:grid;gap:12px}input,button{padding:12px;border-radius:8px;font:inherit}input{border:1px solid #cbd5e1}button{border:0;background:#dc2626;color:#fff;font-weight:bold;cursor:pointer}#message{margin-top:14px;color:#059669}</style><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script></head><body><main class="wrap"><header class="top"><div><h1 class="danger">Reset Data</h1><small id="role">Memuat...</small></div><button type="button" style="background:#64748b" id="logout">Keluar</button></header><section class="card"><h2 class="danger">Zona Berbahaya</h2><p>Fitur ini menghapus transaksi, modal, shift, dan closing. Produk, pengguna, serta pengaturan toko tidak ikut dihapus.</p><form id="form" class="form"><label>Ketik <strong>RESET HIFZI CELL</strong> untuk konfirmasi</label><input id="phrase" autocomplete="off" required><button>Reset Data Operasional</button></form><div id="message"></div></section></main><script>
const names=['transactions','modal','shifts','closing'];auth.onAuthStateChanged(async u=>{if(!u)return location.href='login.html';const d=await db.collection('users').doc(u.uid).get();document.getElementById('role').textContent=(d.exists?d.data().role:'kasir').toUpperCase();document.getElementById('logout').onclick=()=>auth.signOut().then(()=>location.href='login.html');document.getElementById('form').onsubmit=async e=>{e.preventDefault();if(document.getElementById('phrase').value!=='RESET HIFZI CELL')return document.getElementById('message').textContent='Teks konfirmasi tidak sesuai.';if(!confirm('Semua data operasional akan dihapus. Lanjutkan?'))return;for(const name of names){const s=await db.collection(name).get();let batch=db.batch(),n=0;for(const doc of s.docs){batch.delete(doc.ref);if(++n===400){await batch.commit();batch=db.batch();n=0}}if(n)await batch.commit()}document.getElementById('message').textContent='Data operasional berhasil direset.';e.target.reset()}});
</script></body></html>
