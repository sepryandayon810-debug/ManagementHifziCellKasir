<!doctype html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebPOS - Backup & Sync</title><style>body{font-family:Arial,sans-serif;background:#f8fafc;color:#0f172a;margin:0}.wrap{max-width:760px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:24px;margin-top:20px}button{padding:12px 18px;border:0;border-radius:8px;background:#4f46e5;color:#fff;font-weight:bold;cursor:pointer}.note{color:#64748b;line-height:1.6}#message{margin-top:14px;color:#059669}</style><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script></head><body><main class="wrap"><header class="top"><div><h1>Backup & Sync</h1><small id="role">Memuat...</small></div><button id="logout">Keluar</button></header><section class="card"><h2>Backup Data</h2><p class="note">Unduh salinan JSON dari data operasional penting. Backup ini belum menyediakan restore otomatis.</p><button id="export">Unduh Backup JSON</button><div id="message"></div></section></main><script>
const collections=['settings','categories','products','transactions','modal','shifts','closing','debts','customer_directory_v2','saldo_topup_history'];
auth.onAuthStateChanged(async u=>{if(!u)return location.href='login.html';const d=await db.collection('users').doc(u.uid).get();document.getElementById('role').textContent=(d.exists?d.data().role:'kasir').toUpperCase();document.getElementById('logout').onclick=()=>auth.signOut().then(()=>location.href='login.html');document.getElementById('export').onclick=async()=>{const backup={exportedAt:new Date().toISOString(),collections:{}};for(const name of collections){const s=await db.collection(name).get();backup.collections[name]=s.docs.map(x=>({id:x.id,...x.data()}))}const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hifzi-cell-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();document.getElementById('message').textContent='Backup berhasil diunduh.'}});
</script></body></html>
