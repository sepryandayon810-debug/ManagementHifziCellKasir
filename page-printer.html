<!doctype html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebPOS - Printer & Struk</title><style>body{font-family:Arial,sans-serif;background:#f8fafc;color:#0f172a;margin:0}.wrap{max-width:760px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:24px;margin-top:20px}button{padding:12px 18px;border:0;border-radius:8px;background:#4f46e5;color:#fff;font-weight:bold;cursor:pointer;margin:4px}.secondary{background:#64748b}#message{margin-top:14px;color:#059669}</style><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script></head><body><main class="wrap"><header class="top"><div><h1>Printer & Struk</h1><small id="role">Memuat...</small></div><button id="logout">Keluar</button></header><section class="card"><h2>Status Printer</h2><p>Pengaturan printer Bluetooth dan format struk tersedia di halaman Pengaturan.</p><button id="settings">Buka Pengaturan Printer</button><button class="secondary" id="test">Test Print</button><div id="message"></div></section></main><script>
auth.onAuthStateChanged(async u=>{if(!u)return location.href='login.html';const d=await db.collection('users').doc(u.uid).get();document.getElementById('role').textContent=(d.exists?d.data().role:'kasir').toUpperCase();document.getElementById('logout').onclick=()=>auth.signOut().then(()=>location.href='login.html');document.getElementById('settings').onclick=()=>location.href='page-setting.html';document.getElementById('test').onclick=()=>document.getElementById('message').textContent='Silakan hubungkan printer melalui Pengaturan terlebih dahulu.'});
</script></body></html>
