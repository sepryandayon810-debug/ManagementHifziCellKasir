<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4f46e5">
  <title>WebPOS - Kasir</title>

  <!-- SKRIP PENERAPAN TEMA GLOBAL -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem("webpos_theme") || "light";
      const savedColor = localStorage.getItem("webpos_theme_color") || "indigo";
      document.documentElement.setAttribute("data-theme", savedTheme);
      document.documentElement.setAttribute("data-theme-color", savedColor);
    })();
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #4f46e5; --primary-hover: #4338ca; --primary-light: #eef2ff;
      --accent: #0284c7; --accent-light: #e0f2fe;
      --success: #059669; --success-light: #ecfdf5;
      --warning: #d97706; --warning-light: #fffbeb;
      --danger: #dc2626; --danger-light: #fef2f2;
      --bg-base: #f8fafc; --bg-surface: #ffffff; --bg-subtle: #f1f5f9; --border: #e2e8f0;
      --text-main: #0f172a; --text-muted: #64748b; --text-sub: #475569;
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 20px;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05); --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.07); --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
      --sidebar-width: 270px; --sidebar-collapsed: 76px; --header-h: 68px;
    }
    [data-theme-color="green"] { --primary: #059669; --primary-hover: #047857; --primary-light: #ecfdf5; }
    [data-theme-color="blue"] { --primary: #2563eb; --primary-hover: #1d4ed8; --primary-light: #eff6ff; }
    [data-theme-color="orange"] { --primary: #ea580c; --primary-hover: #c2410c; --primary-light: #ffedd5; }
    [data-theme-color="purple"] { --primary: #7c3aed; --primary-hover: #6d28d9; --primary-light: #f5f3ff; }
    [data-theme="dark"] {
      --bg-base: #090d16; --bg-surface: #111827; --bg-subtle: #1e293b; --border: #2e384d;
      --text-main: #f8fafc; --text-muted: #94a3b8; --text-sub: #cbd5e1;
      --primary-light: rgba(79, 70, 229, 0.2); --success-light: rgba(5, 150, 105, 0.15);
      --danger-light: rgba(220, 38, 38, 0.15); --warning-light: rgba(217, 119, 6, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-base); color: var(--text-main); line-height: 1.5; min-height: 100vh; overflow-x: hidden; }
    .app-container { display: flex; min-height: 100vh; position: relative; }
    
    .sidebar-backdrop { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(2px); z-index: 999; opacity: 0; visibility: hidden; transition: all 0.25s ease; }
    .sidebar-backdrop.active { opacity: 1; visibility: visible; }
    .sidebar { position: fixed; top: 0; left: 0; width: var(--sidebar-width); height: 100vh; background: var(--bg-surface); border-right: 1px solid var(--border); z-index: 1000; display: flex; flex-direction: column; transition: transform 0.25s ease, width 0.25s ease; }
    .sidebar.collapsed { width: var(--sidebar-collapsed); }
    @media(max-width: 1024px) { .sidebar { transform: translateX(-100%); } .sidebar.mobile-open { transform: translateX(0); } }
    .sidebar-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; min-height: var(--header-h); }
    .logo-container { display: flex; align-items: center; gap: 0.65rem; }
    .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--primary), #8b5cf6); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 1.15rem; }
    .logo-text { font-size: 1.25rem; font-weight: 800; background: linear-gradient(135deg, var(--primary), #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
    .sidebar.collapsed .logo-text { display: none; }
    .menu-toggle { width: 28px; height: 28px; background: var(--primary); border: none; border-radius: 50%; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; }
    .sidebar.collapsed .menu-toggle { transform: rotate(180deg); }
    .sidebar-search { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); }
    .search-input-wrapper { position: relative; display: flex; align-items: center; }
    .search-input-wrapper i { position: absolute; left: 0.85rem; color: var(--text-muted); font-size: 0.8rem; }
    .search-input { width: 100%; padding: 0.5rem 0.75rem 0.5rem 2.2rem; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg-subtle); color: var(--text-main); font-size: 0.82rem; outline: none; }
    .sidebar.collapsed .sidebar-search { display: none; }
    .sidebar-nav { flex: 1; overflow-y: auto; padding: 1rem 0.75rem; }
    .nav-section { margin-bottom: 1.25rem; }
    .nav-section-title { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); padding: 0.35rem 0.75rem; margin-bottom: 0.2rem; }
    .sidebar.collapsed .nav-section-title { display: none; }
    .nav-menu { list-style: none; }
    .nav-item { margin-bottom: 3px; }
    .nav-link { display: flex; align-items: center; gap: 0.85rem; padding: 0.6rem 0.85rem; border-radius: var(--radius-md); color: var(--text-sub); text-decoration: none; font-size: 0.88rem; font-weight: 600; transition: all 0.15s; cursor: pointer; }
    .nav-link:hover { background: var(--bg-subtle); color: var(--primary); }
    .nav-link.active { background: var(--primary-light); color: var(--primary); }
    .nav-link i { width: 20px; text-align: center; font-size: 0.95rem; }
    .sidebar.collapsed .nav-link span { display: none; }
    .nav-dropdown { position: relative; }
    .nav-dropdown-toggle { justify-content: space-between; }
    .dropdown-arrow { transition: transform 0.2s; font-size: 0.75rem; }
    .nav-dropdown.open .dropdown-arrow { transform: rotate(180deg); }
    .nav-submenu { list-style: none; max-height: 0; overflow: hidden; transition: max-height 0.25s ease; padding-left: 2rem; }
    .nav-dropdown.open .nav-submenu { max-height: 400px; margin-top: 2px; }
    .nav-submenu .nav-link { font-size: 0.82rem; padding: 0.45rem 0.75rem; }
    .sidebar-footer { padding: 0.85rem 1rem; border-top: 1px solid var(--border); background: var(--bg-surface); }
    .user-profile { display: flex; align-items: center; gap: 0.75rem; }
    .user-avatar { width: 38px; height: 38px; background: linear-gradient(135deg, var(--primary), #8b5cf6); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 0.85rem; flex-shrink: 0; }
    .user-info { flex: 1; overflow: hidden; }
    .sidebar.collapsed .user-info { display: none; }
    .user-name { font-weight: 700; font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
    .user-role { font-size: 0.7rem; color: var(--text-muted); text-transform: capitalize; }
    
    .main-content { flex: 1; margin-left: var(--sidebar-width); min-height: 100vh; display: flex; flex-direction: column; transition: margin-left 0.25s; min-width: 0; }
    .sidebar.collapsed ~ .main-content { margin-left: var(--sidebar-collapsed); }
    @media(max-width: 1024px) { .main-content { margin-left: 0 !important; } }
    
    .main-header { height: var(--header-h); background: var(--bg-surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 1.25rem; position: sticky; top: 0; z-index: 90; }
    .header-left { display: flex; align-items: center; gap: 0.85rem; min-width: 0; }
    .header-title { font-size: 1.2rem; font-weight: 700; color: var(--text-main); margin: 0; white-space: nowrap; }
    .header-actions { display: flex; align-items: center; gap: 0.75rem; }
    .btn-icon-box { width: 38px; height: 38px; border-radius: var(--radius-md); background: var(--bg-subtle); border: 1px solid var(--border); color: var(--text-sub); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .page-content { padding: 1.5rem; flex: 1; }

    /* KASIR LAYOUT & KOMPONEN KHUSUS */
    .kasir-layout { display: grid; grid-template-columns: 1fr 380px; gap: 1.25rem; height: calc(100vh - var(--header-h) - 3rem); }
    @media(max-width: 1024px) { .kasir-layout { grid-template-columns: 1fr; height: auto; } }
    
    .product-section { display: flex; flex-direction: column; gap: 1rem; overflow: hidden; }
    .category-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; padding-bottom: 1rem; }
    .cat-grid-btn { background: var(--bg-surface); border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 0.75rem 0.25rem; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; position: relative; transition: all 0.18s; }
    .cat-grid-btn:hover { border-color: var(--primary); transform: translateY(-2px); }
    .cat-grid-icon { width: 40px; height: 40px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; background: var(--bg-subtle); }
    .cat-grid-name { font-size: 0.68rem; font-weight: 700; text-align: center; color: var(--text-main); }
    .cat-grid-badge { position: absolute; top: 4px; right: 4px; font-size: 0.5rem; font-weight: 800; color: #fff; background: var(--primary); border-radius: 99px; padding: 1px 4px; }

    .products-container { flex: 1; overflow-y: auto; padding-right: 0.25rem; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }
    .product-card { background: var(--bg-surface); border-radius: var(--radius-lg); border: 1.5px solid var(--border); overflow: hidden; cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow-sm); }
    .product-card:hover { transform: translateY(-2px); border-color: var(--primary); box-shadow: var(--shadow-md); }
    .product-card-image { aspect-ratio: 1; background: var(--bg-subtle); display: flex; align-items: center; justify-content: center; position: relative; }
    .product-card-image i { font-size: 2rem; color: var(--text-muted); }
    .product-stock-badge { position: absolute; top: 0.4rem; right: 0.4rem; padding: 0.15rem 0.4rem; background: var(--success); color: white; font-size: 0.6rem; font-weight: 700; border-radius: 99px; }
    .product-card-info { padding: 0.75rem; }
    .product-card-name { font-weight: 700; font-size: 0.82rem; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 0.15rem; }
    .product-card-price { font-weight: 800; color: var(--primary); font-size: 0.9rem; }

    /* Keranjang */
    .cart-section { background: var(--bg-surface); border-radius: var(--radius-xl); border: 1.5px solid var(--border); display: flex; flex-direction: column; height: 100%; box-shadow: var(--shadow-sm); }
    .cart-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .cart-title { font-weight: 700; font-size: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    .cart-count { background: var(--primary); color: white; font-size: 0.72rem; padding: 0.1rem 0.5rem; border-radius: 99px; }
    .cart-items { flex: 1; overflow-y: auto; padding: 1rem; }
    .cart-item { display: flex; gap: 0.75rem; padding: 0.75rem; background: var(--bg-subtle); border-radius: var(--radius-md); margin-bottom: 0.5rem; position: relative; border: 1px solid var(--border); }
    .cart-footer { padding: 1rem; border-top: 1px solid var(--border); background: var(--bg-surface); }
    .btn-pay { width: 100%; background: linear-gradient(135deg, var(--success), #047857); color: white; font-size: 1rem; font-weight: 800; padding: 0.9rem; border: none; border-radius: var(--radius-md); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 0.75rem; }

    /* MOBILE BOTTOM BAR */
    .mobile-bar { display: none; position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: var(--bg-surface); border-top: 1px solid var(--border); z-index: 99; padding: 0 0.5rem; }
    .mobile-bar-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--text-muted); font-size: 0.65rem; font-weight: 600; }
    .mobile-bar-item.active { color: var(--primary); }
    .mobile-bar-item i { font-size: 1.1rem; }
    @media (max-width: 1024px) { .mobile-bar { display: flex; } .page-content { padding-bottom: calc(60px + 1.5rem); } }
  </style>

  <!-- Firebase & Core Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js?v=3"></script>
  <script src="js/auth.js"></script>
  <script src="js/db-offline.js"></script>
  <script src="js/sidebar-filter.js"></script>
</head>
<body>

<div class="app-container">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-container">
        <div class="logo-icon"><i class="fas fa-cash-register"></i></div>
        <span class="logo-text">WebPOS</span>

    <div class="sidebar-search">

    <nav class="sidebar-nav">

        <ul class="nav-menu">

          <li class="nav-item"><a href="page-kasir.html" class="nav-link active" data-menu="kasir"><i class="fas fa-calculator"></i><span>Kasir</span></a></li>
          <li class="nav-item"><a href="page-produk.html" class="nav-link" data-menu="produk"><i class="fas fa-box"></i><span>Produk</span></a></li>

    <div class="sidebar-footer">

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <header class="main-header">
      <div class="header-left">
        <button class="btn-icon-box d-md-none" id="mobileMenuToggle" title="Menu"><i class="fas fa-bars"></i></button>
        <h1 class="header-title">Kasir</h1>
      </div>
      <div class="header-actions">
        <button class="btn-icon-box" id="btnThemeToggle" title="Tema Gelap/Terang"><i class="fas fa-moon"></i></button>
        <button class="btn-icon-box" id="btnLogout" title="Keluar"><i class="fas fa-sign-out-alt"></i></button>

    <div class="page-content">
      <div class="kasir-layout">
        <!-- Products Section -->
        <div class="product-section">
          <div id="layerKategori">
            <div style="font-weight:700; margin-bottom:0.75rem;"><i class="fas fa-th-large"></i> Pilih Kategori</div>
            <div class="category-grid" id="categoryGrid"></div>
          </div>
          <div class="products-container">
            <div class="products-grid" id="productsGrid">
              <div style="grid-column:1/-1; text-align:center; color:var(--text-muted); padding:2rem;">Memuat produk...</div>
            </div>

        <!-- Cart Section -->
        <div class="cart-section">
          <div class="cart-header">

            <div style="display:flex; justify-content:space-between; font-weight:800; font-size:1.1rem; margin-bottom:0.5rem;">

<script>
(function() {
  "use strict";

  document.addEventListener("DOMContentLoaded", () => {
    firebase.auth().onAuthStateChanged(user => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      initKasir(user);
    });
  });

  let products = [];
  let categories = [];
  let cart = [];

  function formatRupiah(num) {
    return 'Rp ' + Math.round(num || 0).toLocaleString('id-ID');
  }

  async function initKasir(user) {
    try {
      const uDoc = await firebase.firestore().collection("users").doc(user.uid).get();
      if (uDoc.exists) {
        const u = uDoc.data();
        document.getElementById("userName").textContent = u.name || user.email.split("@")[0];
        document.getElementById("userRole").textContent = (u.role || "Owner").toUpperCase();
        document.getElementById("userAvatar").textContent = (u.name || "K").charAt(0).toUpperCase();
      }
    } catch (e) {}

    setupEvents();
    loadFirestoreData();
  }

  function setupEvents() {
    const sidebar = document.getElementById("sidebar");
    const backdrop = document.getElementById("sidebarBackdrop");
    const menuToggle = document.getElementById("menuToggle");
    const mobileMenuToggle = document.getElementById("mobileMenuToggle");

    if (menuToggle) menuToggle.onclick = () => sidebar.classList.toggle("collapsed");
    if (mobileMenuToggle) {
      mobileMenuToggle.onclick = () => { sidebar.classList.add("mobile-open"); backdrop.classList.add("active"); };
    }
    if (backdrop) backdrop.onclick = () => { sidebar.classList.remove("mobile-open"); backdrop.classList.remove("active"); };

    document.getElementById("btnThemeToggle").onclick = () => {
      const isDark = document.documentElement.getAttribute("data-theme") === "dark";
      const next = isDark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("webpos_theme", next);
    };

    document.getElementById("btnLogout").onclick = () => {
      if (confirm("Keluar dari sistem?")) {
        firebase.auth().signOut().then(() => { window.location.href = "login.html"; });
      }
    };
  }

  async function loadFirestoreData() {
    try {
      const db = firebase.firestore();
      const catSnap = await db.collection('categories').get();
      categories = catSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

      const prodSnap = await db.collection('products').get();
      products = prodSnap.docs.map(doc => ({ id: doc.id, ...doc.data() })).filter(p => p.status !== 'inactive');

      renderCategories();
      renderProducts(products);
    } catch (err) {
      console.error("Error loading Firestore:", err);
    }
  }

  function renderCategories() {
    const grid = document.getElementById('categoryGrid');
    if (!grid) return;
    let html = `<button class="cat-grid-btn" onclick="filterCategory('all')"><div class="cat-grid-icon">📦</div><span class="cat-grid-name">Semua</span></button>`;
    categories.forEach(cat => {
      html += `<button class="cat-grid-btn" onclick="filterCategory('${cat.id}')"><div class="cat-grid-icon">${cat.icon || '🏷️'}</div><span class="cat-grid-name">${cat.name}</span></button>`;
    });
    grid.innerHTML = html;
  }

  window.filterCategory = function(catId) {
    if (catId === 'all') renderProducts(products);
    else renderProducts(products.filter(p => p.categoryId === catId));
  };

  function renderProducts(list) {
    const grid = document.getElementById('productsGrid');
    if (!grid) return;
    if (list.length === 0) {
      grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--text-muted); padding:2rem;">Tidak ada produk</div>`;
      return;
    }
    grid.innerHTML = list.map(p => `
      <div class="product-card" onclick="addToCart('${p.id}')">
        <div class="product-card-image"><i class="fas fa-box"></i><span class="product-stock-badge">${p.isUnlimited ? '∞' : p.stock}</span></div>
        <div class="product-card-info">
          <div class="product-card-name">${p.name}</div>
          <div class="product-card-price">${formatRupiah(p.sellingPrice)}</div>
        </div>
      </div>`).join('');
  }

  window.addToCart = function(id) {
    const p = products.find(x => x.id === id);
    if (!p) return;
    const existing = cart.find(i => i.productId === id);
    if (existing) {
      existing.quantity++;
      existing.total = existing.quantity * existing.price;
    } else {
      cart.push({ productId: p.id, name: p.name, price: p.sellingPrice, quantity: 1, total: p.sellingPrice });
    }
    renderCart();
  };

  function renderCart() {
    const container = document.getElementById('cartItems');
    document.getElementById('cartCount').textContent = cart.reduce((s, i) => s + i.quantity, 0);

    if (cart.length === 0) {
      container.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:3rem 1rem;">Keranjang kosong</div>`;
      document.getElementById('total').textContent = 'Rp 0';
      return;
    }

    container.innerHTML = cart.map(item => `
      <div class="cart-item">
        <div style="flex:1;">
          <div style="font-weight:700; font-size:0.82rem;">${item.name}</div>
          <div style="font-size:0.75rem; color:var(--text-muted);">${item.quantity} x ${formatRupiah(item.price)}</div>
        </div>
        <div style="font-weight:800; color:var(--primary); align-self:center;">${formatRupiah(item.total)}</div>
      </div>`).join('');

    const total = cart.reduce((s, i) => s + i.total, 0);
    document.getElementById('total').textContent = formatRupiah(total);
  }
})();
</script>
</body>
</html>
