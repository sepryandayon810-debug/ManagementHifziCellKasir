<!DOCTYPE html>
<html lang="id" data-theme="light" data-theme-color="green">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#059669">
  <title>WebPOS - Pengaturan</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --primary: #059669; --primary-dark: #047857; --secondary: #84cc16;
      --bg-gradient: radial-gradient(120% 120% at 0% 0%, #ecfdf5 0%, #f0fdf4 50%, #ffffff 100%);
      --bg-card: rgba(255, 255, 255, 0.85); --bg-card-solid: #ffffff; --bg-secondary: #f0fdf4;
      --bg-glass: rgba(255, 255, 255, 0.7); --text-primary: #064e3b; --text-secondary: #065f46;
      --text-muted: #10b981; --border-color: rgba(5, 150, 105, 0.15);
      --radius-xl: 1.25rem; --sidebar-width: 270px; --header-height: 68px;
    }
    [data-theme="dark"] {
      --bg-gradient: radial-gradient(120% 120% at 0% 0%, #064e3b 0%, #022c22 60%, #011f18 100%);
      --bg-card: rgba(6, 78, 59, 0.75); --bg-card-solid: #065f46; --bg-secondary: #064e3b;
      --text-primary: #ecfdf5; --text-secondary: #a7f3d0; --border-color: rgba(52, 211, 153, 0.2);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: var(--bg-gradient); color: var(--text-primary); font-family: 'Plus Jakarta Sans', sans-serif; min-height:100vh; }
    .app-container { display:flex; min-height:100vh; }

    .sidebar { position:fixed; top:0; left:0; width:var(--sidebar-width); height:100vh; background:var(--bg-glass); backdrop-filter:blur(25px); border-right:1px solid var(--border-color); display:flex; flex-direction:column; z-index:1000; }
    .sidebar-header { padding:1.25rem; display:flex; align-items:center; gap:0.75rem; height:var(--header-height); }
    .logo-icon { width:40px; height:40px; border-radius:12px; background:linear-gradient(135deg, var(--primary), var(--secondary)); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; }
    .sidebar-nav { flex:1; padding:1rem 0.75rem; }
    .nav-link { display:flex; align-items:center; gap:0.85rem; padding:0.65rem 0.85rem; border-radius:10px; color:var(--text-secondary); text-decoration:none; font-weight:700; }
    .nav-link.active { background:linear-gradient(135deg, var(--primary), #10b981); color:#fff; }

    .main-content { flex:1; margin-left:var(--sidebar-width); display:flex; flex-direction:column; }
    .main-header { height:var(--header-height); background:var(--bg-glass); border-bottom:1px solid var(--border-color); display:flex; align-items:center; justify-content:space-between; padding:0 1.5rem; }
    .page-content { padding:1.5rem; max-width:800px; }

    .tabs-bar { display:flex; gap:0.5rem; margin-bottom:1.25rem; border-bottom:1.5px solid var(--border-color); padding-bottom:0.5rem; }
    .tab-btn { padding:0.65rem 1.25rem; border-radius:10px; border:none; background:transparent; font-weight:700; color:var(--text-secondary); cursor:pointer; }
    .tab-btn.active { background:var(--primary); color:#fff; }
    .tab-pane { display:none; }
    .tab-pane.active { display:block; }

    .card-setting { background:var(--bg-card); border-radius:var(--radius-xl); border:1px solid var(--border-color); padding:1.5rem; margin-bottom:1.25rem; box-shadow:0 4px 15px rgba(0,0,0,0.04); }
    .form-group { margin-bottom:1rem; }
    .form-label { display:block; font-size:0.8rem; font-weight:700; margin-bottom:0.35rem; }
    .form-input { width:100%; padding:0.75rem; border-radius:10px; border:1px solid var(--border-color); background:var(--bg-card-solid); font-weight:600; color:var(--text-primary); }
    .btn-save { padding:0.75rem 1.5rem; border-radius:10px; border:none; background:linear-gradient(135deg, var(--primary), #10b981); color:#fff; font-weight:800; cursor:pointer; }
  </style>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon"><i class="fas fa-cash-register"></i></div>
        <span style="font-weight:800; font-size:1.2rem;">WebPOS</span>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
        <a href="page-kasir.html" class="nav-link"><i class="fas fa-cash-register"></i> Kasir</a>
        <a href="page-produk.html" class="nav-link"><i class="fas fa-box"></i> Produk</a>
        <a href="page-setting.html" class="nav-link active"><i class="fas fa-cog"></i> Pengaturan</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="main-header">
        <h2 style="font-weight:800; font-size:1.2rem;">Pengaturan Sistem</h2>
      </header>

      <div class="page-content">
        <div class="tabs-bar">
          <button class="tab-btn active" onclick="switchSettingTab('tab-toko')"><i class="fas fa-store"></i> Toko</button>
          <button class="tab-btn" onclick="switchSettingTab('tab-printer')"><i class="fas fa-print"></i> Printer</button>
        </div>

        <!-- Tab Toko -->
        <div class="tab-pane active" id="tab-toko">
          <div class="card-setting">
            <h3 style="margin-bottom:1rem; font-weight:800;"><i class="fas fa-store"></i> Profil Toko &amp; Footer Struk</h3>
            <div class="form-group">
              <label class="form-label">Nama Toko / Konter</label>
              <input type="text" class="form-input" id="storeName" placeholder="Contoh: WebPOS Cell">
            </div>
            <div class="form-group">
              <label class="form-label">Alamat Lengkap</label>
              <input type="text" class="form-input" id="storeAddress" placeholder="Alamat jalan / kota">
            </div>
            <div class="form-group">
              <label class="form-label">No. Telepon / WhatsApp</label>
              <input type="text" class="form-input" id="storePhone" placeholder="08xxxxxxxxxx">
            </div>
            <div class="form-group">
              <label class="form-label">Pesan Kaki Struk</label>
              <input type="text" class="form-input" id="storeFooterNote" placeholder="Terima kasih atas kunjungan Anda">
            </div>
            <button class="btn-save" id="btnSaveStoreProfile">Simpan Pengaturan Toko</button>
          </div>
        </div>

        <!-- Tab Printer -->
        <div class="tab-pane" id="tab-printer">
          <div class="card-setting">
            <h3 style="margin-bottom:1rem; font-weight:800;"><i class="fas fa-print"></i> Printer Thermal Bluetooth (APK)</h3>
            <div class="form-group">
              <label class="form-label">MAC Address Perangkat Printer</label>
              <input type="text" class="form-input" id="printerMacInput" placeholder="00:11:22:33:44:55">
            </div>
            <button class="btn-save" id="btnSavePrinterMac">Simpan Alamat Printer</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/firebase-config.js?v=2"></script>
  <script>
    function switchSettingTab(id) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(id).classList.add('active');
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Ambil data yang tersimpan
      document.getElementById('storeName').value = localStorage.getItem('webpos_store_name') || '';
      document.getElementById('storeAddress').value = localStorage.getItem('webpos_store_address') || '';
      document.getElementById('storePhone').value = localStorage.getItem('webpos_store_phone') || '';
      document.getElementById('storeFooterNote').value = localStorage.getItem('webpos_footer_note') || '';
      document.getElementById('printerMacInput').value = localStorage.getItem('webpos_printer_mac') || '';

      // Direct Event Listener (Bebas Macet)
      document.getElementById('btnSaveStoreProfile').addEventListener('click', () => {
        const name = document.getElementById('storeName').value.trim();
        const address = document.getElementById('storeAddress').value.trim();
        const phone = document.getElementById('storePhone').value.trim();
        const note = document.getElementById('storeFooterNote').value.trim();

        localStorage.setItem('webpos_store_name', name);
        localStorage.setItem('webpos_store_address', address);
        localStorage.setItem('webpos_store_phone', phone);
        localStorage.setItem('webpos_footer_note', note);

        if (typeof database !== 'undefined') {
          database.ref('settings/store').set({ name, address, phone, note });
        }
        alert('Pengaturan toko berhasil disimpan!');
      });

      document.getElementById('btnSavePrinterMac').addEventListener('click', () => {
        const mac = document.getElementById('printerMacInput').value.trim();
        localStorage.setItem('webpos_printer_mac', mac);
        alert('Alamat MAC Printer disimpan!');
      });
    });
  </script>
</body>
</html>
