<!DOCTYPE html>
<html lang="id" data-theme="light" data-theme-color="green">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#059669">
  <title>WebPOS - Produk</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary:#059669; --primary-dark:#047857; --primary-glow:rgba(5,150,105,0.25);
      --secondary:#84cc16; --success:#10b981; --warning:#f59e0b; --danger:#ef4444;
      --bg-gradient: radial-gradient(120% 120% at 0% 0%, #ecfdf5 0%, #f0fdf4 50%, #ffffff 100%);
      --bg-card: rgba(255, 255, 255, 0.85); --bg-card-solid: #ffffff; --bg-secondary: #f0fdf4;
      --bg-glass: rgba(255, 255, 255, 0.7); --text-primary:#064e3b; --text-secondary:#065f46;
      --text-muted:#10b981; --border-color: rgba(5, 150, 105, 0.15);
      --radius-lg: 1rem; --radius-xl: 1.25rem; --radius-2xl: 1.75rem;
      --sidebar-width: 270px; --sidebar-collapsed: 76px; --header-height: 68px;
    }
    [data-theme="dark"] {
      --bg-gradient: radial-gradient(120% 120% at 0% 0%, #064e3b 0%, #022c22 60%, #011f18 100%);
      --bg-card: rgba(6, 78, 59, 0.75); --bg-card-solid: #065f46; --bg-secondary: #064e3b;
      --text-primary: #ecfdf5; --text-secondary: #a7f3d0; --border-color: rgba(52, 211, 153, 0.2);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: var(--bg-gradient); color: var(--text-primary); font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; overflow-x: hidden; }
    .app-container { display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar {
      position: fixed; top: 0; left: 0; width: var(--sidebar-width); height: 100vh;
      background: var(--bg-glass); backdrop-filter: blur(25px); border-right: 1px solid var(--border-color);
      z-index: 1000; display: flex; flex-direction: column; transition: all 0.3s;
    }
    .sidebar.collapsed { width: var(--sidebar-collapsed); }
    @media(max-width: 1024px) {
      .sidebar { transform: translateX(-110%); }
      .sidebar.mobile-open { transform: translateX(0); }
    }
    .sidebar-header { padding: 1.25rem; display: flex; align-items: center; gap: 0.75rem; height: var(--header-height); }
    .logo-icon { width: 44px; height: 44px; border-radius: 14px; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.2rem; }
    .sidebar-nav { flex: 1; padding: 1rem 0.75rem; overflow-y: auto; }
    .nav-link { display: flex; align-items: center; gap: 0.85rem; padding: 0.65rem 0.85rem; border-radius: 12px; color: var(--text-secondary); text-decoration: none; font-weight: 600; }
    .nav-link.active { background: linear-gradient(135deg, var(--primary), #10b981); color: #fff !important; font-weight: 700; }

    .main-content { flex: 1; margin-left: var(--sidebar-width); display: flex; flex-direction: column; transition: margin-left 0.3s; }
    .sidebar.collapsed ~ .main-content { margin-left: var(--sidebar-collapsed); }
    @media(max-width: 1024px) { .main-content { margin-left: 0 !important; } }

    .main-header { height: var(--header-height); background: var(--bg-glass); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; position: sticky; top: 0; z-index: 100; }
    .header-actions { display: flex; gap: 0.5rem; align-items: center; }

    .page-content { padding: 1.5rem; flex: 1; overflow-y: auto; }
    .tab-nav { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; border-bottom: 1.5px solid var(--border-color); padding-bottom: 0.5rem; }
    .tab-btn { padding: 0.65rem 1.25rem; border: none; background: transparent; font-weight: 700; color: var(--text-secondary); border-radius: 10px; cursor: pointer; }
    .tab-btn.active { background: var(--primary); color: white; }

    .toolbar-box { display: flex; gap: 0.75rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .search-input { flex: 1; min-width: 200px; padding: 0.65rem 1rem; border-radius: 12px; border: 1px solid var(--border-color); background: var(--bg-card-solid); color: var(--text-primary); outline: none; }
    .filter-select { padding: 0.65rem 1rem; border-radius: 12px; border: 1px solid var(--border-color); background: var(--bg-card-solid); color: var(--text-primary); font-weight: 600; }

    /* Product Grid Neo */
    .produk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; }
    @media(max-width: 640px) { .produk-grid { grid-template-columns: repeat(2, 1fr); gap: 0.65rem; } }
    .produk-card { background: var(--bg-card); border-radius: var(--radius-xl); border: 1px solid var(--border-color); padding: 1rem; box-shadow: 0 4px 15px rgba(0,0,0,0.03); display: flex; flex-direction: column; justify-content: space-between; position: relative; }
    .produk-name { font-weight: 700; font-size: 0.9rem; margin-bottom: 0.25rem; }
    .produk-price-reg { font-weight: 800; color: var(--primary); font-size: 1rem; }
    .produk-price-reseller { font-size: 0.75rem; font-weight: 700; color: var(--warning); display: block; margin-top: 2px; }

    /* Modal Styling */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 2000; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.25s; padding: 1rem; }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-card { background: var(--bg-card-solid); border-radius: var(--radius-2xl); width: 100%; max-width: 550px; padding: 1.5rem; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border-color); }
    .form-group { margin-bottom: 0.85rem; }
    .form-label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 0.25rem; }
    .form-input { width: 100%; padding: 0.65rem; border-radius: 8px; border: 1px solid var(--border-color); font-weight: 600; color: var(--text-primary); }
    .btn-action { padding: 0.75rem 1.25rem; border-radius: 10px; border: none; font-weight: 800; cursor: pointer; }
  </style>

  <!-- SheetJS for Excel -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  <script src="js/firebase-config.js?v=2"></script>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon"><i class="fas fa-cash-register"></i></div>
        <span style="font-weight:800; font-size:1.2rem; margin-left:0.5rem;">WebPOS</span>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
        <a href="page-kasir.html" class="nav-link"><i class="fas fa-cash-register"></i> Kasir</a>
        <a href="page-produk.html" class="nav-link active"><i class="fas fa-box"></i> Produk</a>
        <a href="page-setting.html" class="nav-link"><i class="fas fa-cog"></i> Pengaturan</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="main-header">
        <h2 style="font-weight:800; font-size:1.2rem;">Katalog Produk &amp; Tier Reseller</h2>
        <div class="header-actions">
          <button id="btnOpenImport" class="btn-action" style="background:var(--bg-secondary); color:var(--text-secondary);"><i class="fas fa-file-import"></i> Import</button>
          <button id="btnExportCSV" class="btn-action" style="background:var(--bg-secondary); color:var(--text-secondary);"><i class="fas fa-file-export"></i> Export</button>
          <button id="btnOpenAddProduct" class="btn-action" style="background:var(--primary); color:#fff;"><i class="fas fa-plus"></i> Tambah Produk</button>
        </div>
      </header>

      <div class="page-content">
        <div class="toolbar-box">
          <input type="text" class="search-input" id="searchProductInput" placeholder="Cari nama produk atau kode...">
          <select class="filter-select" id="filterCategory"><option value="">Semua Kategori</option></select>
        </div>

        <div class="produk-grid" id="productGridContainer"></div>
      </div>
    </main>
  </div>

  <!-- Modal Tambah/Edit Produk -->
  <div class="modal-overlay" id="productModal">
    <div class="modal-card">
      <h3 style="font-weight:800; margin-bottom:1rem;" id="modalTitle">Tambah Produk Baru</h3>
      <input type="hidden" id="prodId">

      <div class="form-group">
        <label class="form-label">Nama Produk *</label>
        <input type="text" class="form-input" id="prodName" required placeholder="Nama barang">
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.5rem;">
        <div class="form-group">
          <label class="form-label">Kategori *</label>
          <select class="form-input" id="prodCategory"></select>
        </div>
        <div class="form-group">
          <label class="form-label">Stok Fisik *</label>
          <input type="number" class="form-input" id="prodStock" placeholder="0">
        </div>
      </div>

      <!-- TIER HARGA MODAL, UMUM, & RESELLER -->
      <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:0.5rem;">
        <div class="form-group">
          <label class="form-label">Harga Modal (HPP) *</label>
          <input type="number" class="form-input" id="prodCost" placeholder="0">
        </div>
        <div class="form-group">
          <label class="form-label">Harga Jual Umum *</label>
          <input type="number" class="form-input" id="prodPrice" placeholder="0">
        </div>
        <div class="form-group">
          <label class="form-label">Harga Reseller</label>
          <input type="number" class="form-input" id="prodResellerPrice" placeholder="Kosongkan jika sama">
        </div>
      </div>

      <div style="display:flex; gap:0.5rem; margin-top:1rem;">
        <button onclick="closeProductModal()" style="flex:1; padding:0.65rem; border:1px solid var(--border-color); background:none; border-radius:8px; font-weight:700; cursor:pointer;">Batal</button>
        <button id="btnSaveProduct" class="btn-action" style="flex:1; background:var(--primary); color:#fff;">Simpan</button>
      </div>
    </div>
  </div>

  <script>
    let products = [];
    let categories = [];

    function formatRupiah(n) { return 'Rp ' + Math.round(n || 0).toLocaleString('id-ID'); }

    document.addEventListener('DOMContentLoaded', () => {
      // Direct Event Bindings
      document.getElementById('btnOpenAddProduct').addEventListener('click', openAddModal);
      document.getElementById('btnSaveProduct').addEventListener('click', saveProduct);
      document.getElementById('searchProductInput').addEventListener('input', renderProductCatalog);
      document.getElementById('btnExportCSV').addEventListener('click', exportCSV);

      loadCategoriesAndProducts();
    });

    async function loadCategoriesAndProducts() {
      // Load Categories
      const cSnap = await database.ref('categories').once('value');
      const cVal = cSnap.val() || {};
      categories = Object.entries(cVal).map(([id, d]) => ({ id, ...d }));

      const select = document.getElementById('prodCategory');
      const filter = document.getElementById('filterCategory');
      select.innerHTML = '<option value="">Pilih Kategori</option>';
      categories.forEach(c => {
        select.innerHTML += `<option value="${c.id}">${c.name}</option>`;
        filter.innerHTML += `<option value="${c.id}">${c.name}</option>`;
      });

      // Load Products Realtime
      database.ref('products').on('value', snap => {
        const val = snap.val() || {};
        products = Object.entries(val).map(([id, d]) => ({ id, ...d })).filter(p => p.status !== 'inactive');
        renderProductCatalog();
      });
    }

    function renderProductCatalog() {
      const q = document.getElementById('searchProductInput').value.toLowerCase().trim();
      const grid = document.getElementById('productGridContainer');
      const filtered = products.filter(p => !q || (p.name && p.name.toLowerCase().includes(q)));

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:2rem; color:var(--text-muted);">Produk tidak ditemukan</div>';
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div class="produk-card">
          <div>
            <div class="produk-name">${p.name}</div>
            <div style="font-size:0.75rem; color:var(--text-muted);">Stok: ${p.stock || 0}</div>
            <div class="produk-price-reg">${formatRupiah(p.sellingPrice)}</div>
            ${p.resellerPrice ? `<span class="produk-price-reseller">Reseller: ${formatRupiah(p.resellerPrice)}</span>` : ''}
          </div>
          <div style="display:flex; gap:0.5rem; margin-top:0.75rem;">
            <button onclick="editProduct('${p.id}')" style="flex:1; padding:0.4rem; border:none; background:rgba(5,150,105,0.1); color:var(--primary); border-radius:6px; font-weight:700; cursor:pointer;"><i class="fas fa-edit"></i> Edit</button>
            <button onclick="deleteProduct('${p.id}')" style="flex:1; padding:0.4rem; border:none; background:rgba(239,68,68,0.1); color:var(--danger); border-radius:6px; font-weight:700; cursor:pointer;"><i class="fas fa-trash"></i> Hapus</button>
          </div>
        </div>
      `).join('');
    }

    function openAddModal() {
      document.getElementById('prodId').value = '';
      document.getElementById('prodName').value = '';
      document.getElementById('prodCost').value = '';
      document.getElementById('prodPrice').value = '';
      document.getElementById('prodResellerPrice').value = '';
      document.getElementById('prodStock').value = '0';
      document.getElementById('modalTitle').textContent = 'Tambah Produk Baru';
      document.getElementById('productModal').classList.add('active');
    }

    function closeProductModal() {
      document.getElementById('productModal').classList.remove('active');
    }

    function editProduct(id) {
      const p = products.find(x => x.id === id);
      if (!p) return;
      document.getElementById('prodId').value = p.id;
      document.getElementById('prodName').value = p.name;
      document.getElementById('prodCategory').value = p.categoryId || '';
      document.getElementById('prodCost').value = p.costPrice || 0;
      document.getElementById('prodPrice').value = p.sellingPrice || 0;
      document.getElementById('prodResellerPrice').value = p.resellerPrice || '';
      document.getElementById('prodStock').value = p.stock || 0;
      document.getElementById('modalTitle').textContent = 'Edit Produk & Reseller';
      document.getElementById('productModal').classList.add('active');
    }

    async function saveProduct() {
      const id = document.getElementById('prodId').value;
      const name = document.getElementById('prodName').value.trim();
      const cost = parseFloat(document.getElementById('prodCost').value) || 0;
      const price = parseFloat(document.getElementById('prodPrice').value) || 0;
      const resellerPrice = parseFloat(document.getElementById('prodResellerPrice').value) || price;
      const stock = parseInt(document.getElementById('prodStock').value) || 0;

      if (!name || price <= 0) return alert('Nama dan harga jual wajib diisi!');

      const payload = {
        name,
        costPrice: cost,
        sellingPrice: price,
        resellerPrice: resellerPrice,
        stock: stock,
        categoryId: document.getElementById('prodCategory').value || '',
        status: 'active',
        updatedAt: Date.now()
      };

      if (id) {
        await database.ref(`products/${id}`).update(payload);
      } else {
        payload.createdAt = Date.now();
        await database.ref('products').push(payload);
      }

      closeProductModal();
    }

    async function deleteProduct(id) {
      if (confirm('Hapus produk ini?')) {
        await database.ref(`products/${id}`).remove();
      }
    }

    function exportCSV() {
      var csv = "Nama Produk,Harga Beli,Harga Jual,Harga Reseller,Stok\n";
      products.forEach(p => {
        csv += `"${p.name}",${p.costPrice||0},${p.sellingPrice||0},${p.resellerPrice||p.sellingPrice||0},${p.stock||0}\n`;
      });
      const blob = new Blob([csv], {type:'text/csv'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'produk_reseller.csv';
      a.click();
    }
  </script>
</body>
</html>
