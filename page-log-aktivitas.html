<!doctype html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebPOS - Log Aktivitas</title><style>body{font-family:Arial,sans-serif;background:#f8fafc;color:#0f172a;margin:0}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.card{background:#fff;padding:20px;border:1px solid #e2e8f0;border-radius:16px;overflow:auto}.table{width:100%;min-width:700px;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid #e2e8f0;text-align:left}button{padding:10px 16px;background:#4f46e5;color:#fff;border:0;border-radius:8px;font-weight:bold}</style><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script></head><body><main class="wrap"><header class="top"><div><h1>Log Aktivitas</h1><small id="role">Memuat...</small></div><button id="logout">Keluar</button></header><section class="card"><table class="table"><thead><tr><th>Aksi</th><th>Detail</th><th>Pengguna</th><th>Waktu</th></tr></thead><tbody id="rows"><tr><td colspan="4">Memuat...</td></tr></tbody></table></section></main><script>
auth.onAuthStateChanged(async u=>{if(!u)return location.href='login.html';const d=await db.collection('users').doc(u.uid).get();document.getElementById('role').textContent=(d.exists?d.data().role:'kasir').toUpperCase();document.getElementById('logout').onclick=()=>auth.signOut().then(()=>location.href='login.html');const s=await db.collection('activity_logs').orderBy('timestamp','desc').limit(100).get().catch(()=>({docs:[]}));document.getElementById('rows').innerHTML=s.docs.length?s.docs.map(x=>{const v=x.data(),t=v.timestamp?.toDate?v.timestamp.toDate().toLocaleString('id-ID'):'-';return `<tr><td>${v.action||'-'}</td><td>${v.detail||'-'}</td><td>${v.userName||'-'}</td><td>${t}</td></tr>`}).join(''):'<tr><td colspan="4">Belum ada aktivitas tercatat.</td></tr>'});
</script></body></html>
