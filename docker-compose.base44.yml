services:
  web:
    image: nginx:alpine
    container_name: webpos-web
    working_dir: /usr/share/nginx/html
    volumes:
      - ./:/usr/share/nginx/html:ro
    ports:
      - "3000:80"
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
